<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register Account - MP Citizen Portal 2.0. Create your digital portal profile to access schemes and services.">
  <title data-translate="register_title">Create Portal Account | MP Citizen Portal 2.0</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Core Design System & Auth Custom Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body>

  <!-- Clean Auth Header -->
  <header class="auth-header" id="auth-header">
    <div class="container header-container">
      <a href="index.html" class="brand" aria-label="MP Citizen Portal Home">
        <img src="assets/mp_logo.png" alt="Government of Madhya Pradesh Emblem" class="brand-logo">
        <div class="brand-text">
          <span class="brand-title" data-translate="auth_portal_title">MP Citizen Portal 2.0</span>
        </div>
      </a>

      <div class="header-actions">
        <!-- Return Home Button -->
        <a href="index.html" class="btn-back-home" data-translate="btn_back_home">
          <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <!-- Language Switcher -->
        <button class="btn-lang" id="lang-toggle-btn">हिन्दी</button>
        
        <!-- Dark/Light Mode Switcher -->
        <button class="btn-toggle" id="theme-toggle-btn" aria-label="Toggle Dark/Light Mode">
          <i class="fas fa-sun"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Fullscreen Heritage Slideshow Background -->
  <div class="auth-bg-slider">
    <div class="auth-bg-slide" style="background-image: url('assets/sanchi_stupa.png');"></div>
    <div class="auth-bg-slide" style="background-image: url('assets/khajuraho.png');"></div>
    <div class="auth-bg-slide" style="background-image: url('assets/gwalior_fort.png');"></div>
    <div class="auth-bg-slide" style="background-image: url('assets/mp_tiger.png');"></div>
    <div class="auth-bg-slide" style="background-image: url('assets/narmada_river.png');"></div>
    <div class="auth-bg-slide" style="background-image: url('assets/wheat_fields.png');"></div>
  </div>
  <div class="auth-bg-overlay"></div>
  <div class="auth-orbs-container">
    <div class="auth-orb orb-primary"></div>
    <div class="auth-orb orb-secondary"></div>
    <div class="auth-orb orb-saffron"></div>
  </div>
  <div class="auth-particles"></div>

  <!-- Primary Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-card" style="margin-top: 1.5rem; margin-bottom: 1.5rem;">
        
        <!-- Loading & Success Fullscreen Overlay -->
        <div class="auth-loader-overlay" id="auth-overlay">
          <div class="auth-overlay-spinner" id="auth-spinner"></div>
          <div class="auth-loader-text" id="auth-loader-text">Creating secure profile...</div>
          <div class="auth-success-box" id="auth-success-box">
            <div class="success-checkmark">
              <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
              </svg>
            </div>
            <h3 class="auth-overlay-text" id="auth-success-title">Registration Successful</h3>
            <p class="auth-subtitle" id="auth-success-desc" style="margin-top: 0.5rem;">Redirecting to verify mobile...</p>
          </div>
        </div>

        <!-- Emblem & Card Header -->
        <div class="auth-logo-header">
          <img src="assets/mp_logo.png" alt="MP Government Emblem" class="auth-emblem">
          <h2 class="auth-title" data-translate="register_title">Create Portal Account</h2>
          <p class="auth-subtitle" data-translate="register_subtitle">Join millions of citizens accessing digital state services</p>
        </div>

        <!-- Registration Form -->
        <form id="register-form" novalidate>
          <!-- Full Name -->
          <div class="auth-form-group">
            <input type="text" id="reg-name" class="auth-input-control" placeholder=" " required minlength="3" autocomplete="name">
            <label for="reg-name" class="auth-input-label" data-translate="label_fullname">Full Name</label>
            <i class="fas fa-user auth-input-icon"></i>
            <span class="auth-validation-msg"></span>
          </div>

          <!-- Email Address -->
          <div class="auth-form-group">
            <input type="email" id="reg-email" class="auth-input-control" placeholder=" " required autocomplete="email">
            <label for="reg-email" class="auth-input-label" data-translate="label_email">Email Address</label>
            <i class="fas fa-envelope auth-input-icon"></i>
            <span class="auth-validation-msg"></span>
          </div>

          <!-- Mobile Number -->
          <div class="auth-form-group">
            <input type="tel" id="reg-mobile" class="auth-input-control" placeholder=" " required maxlength="10" autocomplete="tel">
            <label for="reg-mobile" class="auth-input-label" data-translate="label_mobile">Mobile Number</label>
            <i class="fas fa-phone auth-input-icon"></i>
            <span class="auth-validation-msg"></span>
          </div>

          <!-- Password -->
          <div class="auth-form-group" style="margin-bottom: 1.25rem;">
            <input type="password" id="reg-password" class="auth-input-control" placeholder=" " required autocomplete="new-password">
            <label for="reg-password" class="auth-input-label" data-translate="label_password">Password</label>
            <i class="fas fa-lock auth-input-icon"></i>
            <button type="button" class="auth-password-toggle" aria-label="Toggle Password Visibility">
              <i class="fas fa-eye"></i>
            </button>
            <span class="auth-validation-msg"></span>
          </div>

          <!-- Password Strength Indicator -->
          <div class="strength-meter-container">
            <div class="strength-meter-bar">
              <div class="strength-meter-progress"></div>
            </div>
            <div class="strength-meter-text">
              <span data-translate="label_password">Password Strength</span>
              <span></span>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="auth-form-group">
            <input type="password" id="reg-password-confirm" class="auth-input-control" placeholder=" " required autocomplete="new-password">
            <label for="reg-password-confirm" class="auth-input-label" data-translate="label_confirm_password">Confirm Password</label>
            <i class="fas fa-lock auth-input-icon"></i>
            <button type="button" class="auth-password-toggle" aria-label="Toggle Password Visibility">
              <i class="fas fa-eye"></i>
            </button>
            <span class="auth-validation-msg"></span>
          </div>

          <!-- Terms check -->
          <div class="auth-options" style="margin-bottom: 2rem;">
            <label class="auth-remember-me" style="line-height: 1.3;">
              <input type="checkbox" id="reg-terms" required>
              <span data-translate="chk_terms" style="font-size: 0.825rem;">I accept the Portal Terms & Conditions</span>
            </label>
          </div>

          <!-- Create Account Button -->
          <button type="submit" class="btn-auth-submit">
            <span class="btn-auth-spinner"></span>
            <span data-translate="btn_register">Create Account</span>
          </button>
        </form>

        <!-- Redirect Link Option -->
        <div class="auth-redirect-footer">
          <span data-translate="have_account">Already have an account?</span>
          <a href="login.html" data-translate="link_login">Login Here</a>
        </div>
        
      </div>
    </div>
  </main>

  <!-- Interactive JavaScript logic -->
  <script src="js/auth.js"></script>
</body>
</html>
